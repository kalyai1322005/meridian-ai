name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: meridian-ai
  STACK_NAME: meridian-ai

jobs:
  deploy:
    name: Build, provision, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # TEMPORARY: prints what GitHub sends to AWS and what the AWS_ROLE_ARN secret looks like,
      # so the "Not authorized to perform sts:AssumeRoleWithWebIdentity" error can be traced.
      # Logs of a public repo are public, so only a masked account number is printed. Delete this step afterwards.
      - name: Diagnose AWS login settings (temporary)
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        shell: bash
        run: |
          if [ -z "$ROLE_ARN" ]; then echo "PROBLEM: secret AWS_ROLE_ARN is EMPTY or missing"; else
            echo "secret length: ${#ROLE_ARN} (a correct value for this role is 51)"
            if [[ "$ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/([A-Za-z0-9+=,.@_-]+)$ ]]; then
              ACC="${BASH_REMATCH[1]}"
              echo "secret format: OK"
              echo "secret account (masked): ${ACC:0:3}...${ACC:9:3}"
              echo "secret role name: ${BASH_REMATCH[2]}"
            else
              echo "PROBLEM: secret does not look like arn:aws:iam::<12 digits>:role/<name> (extra space, quote or newline?)"
            fi
          fi
          echo "--- what GitHub will tell AWS (OIDC token claims) ---"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          TOKEN="$TOKEN" python3 -c 'import os,json,base64; p=os.environ["TOKEN"].split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); [print(k+":", c.get(k)) for k in ("iss","aud","sub","repository","ref","job_workflow_ref")]'

      - name: Assume AWS deployment role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find AWS account and ensure ECR repository exists
        id: account
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-tag-mutability IMMUTABLE \
              --image-scanning-configuration scanOnPush=true >/dev/null
          echo "registry=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish container image
        id: image
        env:
          REGISTRY: ${{ steps.account.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Create or update AWS infrastructure and app
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/aws/template.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageUri="${{ steps.image.outputs.uri }}" \
              BedrockChatModelId="us.amazon.nova-lite-v1:0" \
              BedrockEmbeddingModelId="amazon.titan-embed-text-v2:0"

      - name: Print deployment address
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue | [0]" --output text

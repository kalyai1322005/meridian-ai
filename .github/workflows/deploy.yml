name: Deploy to AWS (ECS Express Mode)

# One-time setup first: see DEPLOY.md (create the CloudFormation stack from infra/aws-bootstrap.yaml,
# then add the secret AWS_ROLE_ARN and the variables AWS_REGION and AWS_STACK_NAME to this repository).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets GitHub prove its identity to AWS (no stored access keys)

# One deploy at a time: a second run waits instead of racing the first.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest backend/tests -q

  deploy:
    name: Build image & deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the Docker image
        run: |
          REPO_URI=$(aws cloudformation describe-stacks --stack-name "$AWS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" --output text)
          docker build -t "$REPO_URI:${GITHUB_SHA}" -t "$REPO_URI:latest" .
          docker push "$REPO_URI:${GITHUB_SHA}"
          docker push "$REPO_URI:latest"

      - name: Create or update the ECS Express Mode service
        env:
          IMAGE_TAG: ${{ github.sha }}
          # Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables):
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}                   # set to "bedrock" to use Amazon Bedrock for chat
          BEDROCK_LLM_MODEL_ID: ${{ vars.BEDROCK_LLM_MODEL_ID }}
        run: ./infra/deploy-service.sh

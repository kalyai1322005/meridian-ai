# FREE deployment to a Hugging Face Space (Docker). Optional: it does nothing until you set
# the HF_TOKEN secret and the HF_SPACE variable (for example "kalyai1322005/meridian-ai").
# Setup steps are in DEPLOY-FREE.md.
name: Deploy to Hugging Face Space (free)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable not set - skipping (see DEPLOY-FREE.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - name: Push to the Space
        if: steps.cfg.outputs.ready == 'true'
        run: |
          rm -rf /tmp/space && mkdir /tmp/space
          rsync -a --exclude '.git' --exclude 'node_modules' --exclude 'docs' --exclude 'infrastructure' ./ /tmp/space/
          cp hf-space/README.md /tmp/space/README.md
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
